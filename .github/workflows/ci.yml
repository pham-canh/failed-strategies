name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # These strategies are Freqtrade IStrategy subclasses and cannot be
      # imported without freqtrade, TA-Lib and a compiled numpy stack. Running
      # the backtest in CI would cost more minutes than it is worth for a
      # research repo, so the gate here is deliberately the two things that
      # actually break in practice: a strategy file that no longer parses, and
      # a universe/pairs JSON that a half-finished data refresh corrupted.
      - name: strategy syntax
        run: python -m compileall -q strategies/
      - name: data integrity
        run: |
          python - <<'PY'
          import datetime as dt
          import json

          PAIR_FIELDS = {"a", "b", "beta", "p", "hl", "mu", "sd"}

          # universe.json is a flat list of Binance symbols.
          universe = json.load(open("universe.json"))
          assert isinstance(universe, list), "universe.json must be a list"
          assert len(universe) >= 40, f"universe.json shrank to {len(universe)}"
          bad = [s for s in universe if not isinstance(s, str) or not s]
          assert not bad, f"universe.json has bad symbols: {bad[:5]}"
          print(f"universe.json: {len(universe)} symbols ok")

          # pairs_dyn.json is a rolling weekly window: [{start, pairs:[{a,b,beta,p,hl,mu,sd}]}].
          # It is regenerated by the data refresh, so this is where a truncated
          # download or a half-written record actually shows up.
          windows = json.load(open("pairs_dyn.json"))
          assert isinstance(windows, list), "pairs_dyn.json must be a list"
          assert len(windows) >= 40, f"pairs_dyn.json shrank to {len(windows)} windows"
          for i, win in enumerate(windows):
              assert isinstance(win.get("start"), str), f"window {i} has no start"
              dt.datetime.fromisoformat(win["start"])  # raises on a truncated timestamp
              pairs = win.get("pairs")
              assert isinstance(pairs, list) and pairs, f"window {i} has no pairs"
              for j, pair in enumerate(pairs):
                  missing = PAIR_FIELDS - pair.keys()
                  assert not missing, f"window {i} pair {j} missing {sorted(missing)}"
                  assert pair["a"] != pair["b"], f"window {i} pair {j} is self-paired"
                  for field in PAIR_FIELDS - {"a", "b"}:
                      assert isinstance(pair[field], (int, float)), \
                          f"window {i} pair {j} field {field} is not numeric"
          total = sum(len(w["pairs"]) for w in windows)
          print(f"pairs_dyn.json: {len(windows)} windows, {total} pair rows ok")
          PY